<h1>ShoShort 분석</h1>
<p>ShoShort 분석은 채널 운영자가 <strong>자기 유튜브 쇼츠 채널</strong>(역사 B컷, 스토리텔러)의 성과를 보기 위해 만든 개인용 도구입니다.</p>
<p>운영자가 직접 허용한 채널에서 YouTube Analytics 지표(조회수, 시청 시간, 평균 시청 비율, 유지 그래프, 유입 경로, 구독자 증감)를 읽기 전용으로 받아 운영자의 컴퓨터에 저장합니다. 이 데이터로 어떤 영상이 잘 보였는지 분석해 다음 영상 제작에 참고합니다.</p>
<p>공개 서비스가 아니며, 다른 사용자의 데이터는 받지 않습니다.</p>
